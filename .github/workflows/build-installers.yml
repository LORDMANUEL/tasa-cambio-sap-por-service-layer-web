name: Build Atas installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      PYTHON_EMBED_VERSION: '3.13.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Test application
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q app
          python -m pytest -q
      - name: Assemble embedded Python package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows-package/runtime/python | Out-Null
          $url = "https://www.python.org/ftp/python/$env:PYTHON_EMBED_VERSION/python-$env:PYTHON_EMBED_VERSION-embed-amd64.zip"
          Invoke-WebRequest $url -OutFile dist/python-embed.zip
          Expand-Archive dist/python-embed.zip -DestinationPath dist/windows-package/runtime/python -Force
          New-Item -ItemType Directory -Force dist/windows-package/runtime/python/Lib/site-packages | Out-Null
          python -m pip install --disable-pip-version-check -r requirements.txt --target dist/windows-package/runtime/python/Lib/site-packages
          $pth = Get-ChildItem dist/windows-package/runtime/python -Filter 'python*._pth' | Select-Object -First 1
          @('python313.zip','.','Lib','Lib\site-packages','..\..','import site') | Set-Content -Encoding ASCII $pth.FullName
      - name: Copy application payload
        shell: pwsh
        run: |
          $exclude = @('.git','.github','.venv','dist','build','runtime','.pytest_cache','__pycache__','.env','site')
          Get-ChildItem -Force | Where-Object { $exclude -notcontains $_.Name } | ForEach-Object { Copy-Item $_.FullName -Destination dist/windows-package -Recurse -Force }
          Get-ChildItem dist/windows-package/data -Filter '*.db' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $portableDir = Join-Path $pwd 'dist/windows-package'
          $portableZip = Join-Path $pwd 'dist/Atas-V5-Portable-x64.zip'
          if (Test-Path $portableZip) { Remove-Item $portableZip -Force }
          Compress-Archive -Path "$portableDir\*" -DestinationPath $portableZip -CompressionLevel Optimal
          $zip = Get-Item $portableZip
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          $mib = [math]::Round($zip.Length / 1MB, 2)
          @(
            "product=Atas"
            "version=5.0.0"
            "platform=windows-portable-x64"
            "file=$($zip.Name)"
            "bytes=$($zip.Length)"
            "mib=$mib"
            "sha256=$hash"
            "python_embedded=3.13.14"
            "author=Luis Manuel Fajardo Rivera (LORDMANUEL)"
            "repository=https://github.com/LORDMANUEL/tasa-cambio-sap-por-service-layer-web"
          ) | Set-Content -Encoding UTF8 dist/BUILD_INFO_PORTABLE.txt
          Write-Host "ATAS_PORTABLE_ZIP=$($zip.Name)"
          Write-Host "ATAS_PORTABLE_BYTES=$($zip.Length)"
          Write-Host "ATAS_PORTABLE_MIB=$mib"
          Write-Host "ATAS_PORTABLE_SHA256=$hash"
      - name: Smoke test portable ZIP
        shell: pwsh
        run: |
          $portableZip = Join-Path $pwd 'dist/Atas-V5-Portable-x64.zip'
          $target = Join-Path $env:RUNNER_TEMP 'AtasPortableSmoke'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          Expand-Archive $portableZip -DestinationPath $target -Force
          if (-not (Test-Path "$target\runtime\python\python.exe")) { throw "Portable embedded Python missing" }
          if (-not (Test-Path "$target\app\main.py")) { throw "Portable Atas application missing" }
          $stdout = Join-Path $env:RUNNER_TEMP 'atas-portable-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'atas-portable-err.log'
          $proc = Start-Process -FilePath "$target\runtime\python\python.exe" -ArgumentList '-m','app.run_server' -WorkingDirectory $target -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8787/health' -TimeoutSec 2
                if ($h.status -eq 'ok' -and $h.service -eq 'Atas') { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "Atas portable ZIP did not pass /health smoke test"
            }
            Write-Host "ATAS_PORTABLE_SMOKE=OK"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Atas-Windows-Portable-x64
          path: |
            dist/Atas-V5-Portable-x64.zip
            dist/BUILD_INFO_PORTABLE.txt
          if-no-files-found: error
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/installer | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/windows/Atas.iss "/DSourceDir=$pwd\dist\windows-package" "/DOutputDir=$pwd\dist\installer"
      - name: Smoke test installed Windows EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'AtasSmoke'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          $install = Start-Process -FilePath $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Atas installer returned $($install.ExitCode)" }
          if (-not (Test-Path "$target\runtime\python\python.exe")) { throw "Embedded Python missing after install" }
          if (-not (Test-Path "$target\app\main.py")) { throw "Atas application missing after install" }
          $stdout = Join-Path $env:RUNNER_TEMP 'atas-server-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'atas-server-err.log'
          $proc = Start-Process -FilePath "$target\runtime\python\python.exe" -ArgumentList '-m','app.run_server' -WorkingDirectory $target -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8787/health' -TimeoutSec 2
                if ($h.status -eq 'ok' -and $h.service -eq 'Atas') { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Installed Atas did not pass /health smoke test"
          }
            Write-Host "ATAS_WINDOWS_SMOKE=OK"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Inspect Windows package
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          if (-not $exe) { throw "Atas EXE not found" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $mib = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "ATAS_WINDOWS_EXE=$($exe.Name)"
          Write-Host "ATAS_WINDOWS_EXE_BYTES=$($exe.Length)"
          Write-Host "ATAS_WINDOWS_EXE_MIB=$mib"
          Write-Host "ATAS_WINDOWS_EXE_SHA256=$hash"
          @(
            "product=Atas"
            "version=5.0.0"
            "platform=windows-x64"
            "file=$($exe.Name)"
            "bytes=$($exe.Length)"
            "mib=$mib"
            "sha256=$hash"
            "python_embedded=3.13.14"
            "author=Luis Manuel Fajardo Rivera (LORDMANUEL)"
            "repository=https://github.com/LORDMANUEL/tasa-cambio-sap-por-service-layer-web"
          ) | Set-Content -Encoding UTF8 dist/installer/BUILD_INFO.txt
          if (-not (Test-Path dist/windows-package/runtime/python/python.exe)) { throw "Embedded Python missing" }
          if (-not (Test-Path dist/windows-package/app/main.py)) { throw "Application payload missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: Atas-Windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/BUILD_INFO.txt
          if-no-files-found: error

  debian-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Test application
        env:
          SAPFX_FERNET_KEY_FILE: ${{ runner.temp }}/atas-ci.key
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q app
          python -m pytest -q
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rsync dpkg-dev
      - name: Build DEB
        run: VERSION=5.0.0 ./scripts/build_deb.sh
      - name: Install and smoke test Debian package
        run: |
          DEB=$(ls dist/atas_*.deb | head -1)
          sudo apt-get install -y "./$DEB"
          test -x /opt/atas/.venv/bin/python
          test -f /opt/atas/app/main.py
          cd /opt/atas
          sudo -u atas env SAPFX_FERNET_KEY_FILE=/var/lib/atas/.credential.key /opt/atas/.venv/bin/python -m app.run_server > /tmp/atas-smoke.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          OK=0
          for i in $(seq 1 30); do
            sleep 1
            if curl -fsS http://127.0.0.1:8787/health | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='ok' and d['service']=='Atas'" 2>/dev/null; then
              OK=1
              break
            fi
          done
          if [ "$OK" -ne 1 ]; then
            cat /tmp/atas-smoke.log
            exit 1
          fi
          echo "ATAS_DEBIAN_SMOKE=OK"
          kill $PID 2>/dev/null || true
          trap - EXIT
          cd "$GITHUB_WORKSPACE"
      - name: Inspect Debian package
        run: |
          DEB=$(ls dist/atas_*.deb | head -1)
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | grep -q '/opt/atas/'
          BYTES=$(stat -c%s "$DEB")
          SHA=$(sha256sum "$DEB" | awk '{print $1}')
          MIB=$(awk "BEGIN {printf \"%.2f\", $BYTES/1048576}")
          echo "ATAS_DEB=$(basename "$DEB")"
          echo "ATAS_DEB_BYTES=$BYTES"
          echo "ATAS_DEB_MIB=$MIB"
          echo "ATAS_DEB_SHA256=$SHA"
          {
            echo "product=Atas"
            echo "version=5.0.0"
            echo "platform=debian-amd64"
            echo "file=$(basename "$DEB")"
            echo "bytes=$BYTES"
            echo "mib=$MIB"
            echo "sha256=$SHA"
            echo "author=Luis Manuel Fajardo Rivera (LORDMANUEL)"
            echo "repository=https://github.com/LORDMANUEL/tasa-cambio-sap-por-service-layer-web"
          } > dist/BUILD_INFO_DEBIAN.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Atas-Debian-amd64
          path: |
            dist/*.deb
            dist/BUILD_INFO_DEBIAN.txt
          if-no-files-found: error
